{%- comment -%} Visitors: today / total from GoatCounter (styles: _sass/misc/sidebar-widgets.scss) {%- endcomment -%}
<div class="sticky-note-widget visitor-sticky">
  <div class="sticky-content">
    <div class="sticky-title">Visitors</div>
    <div class="visitor-stats-grid">
      <div class="visitor-stat">
        <span class="stat-label">Today</span>
        <span class="stat-value" id="today-visitors">-</span>
      </div>
      <div class="visitor-stat">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="total-visitors">-</span>
      </div>
    </div>
  </div>
</div>

<script>
// Site-wide visitor counts from GoatCounter's public counter
// (_data/goatcounter.yml). GoatCounter caches these responses for up to
// 4 hours.
// The last counts fetched are kept in this browser and shown at once (this
// script runs before the page first paints), so the numbers don't pop in
// late when you come back to the home page; the fresh fetch then updates
// them. Today's count is only reused on the same day.
(function() {
  var code = {{ site.data.goatcounter.code | jsonify }};
  if (!code) return;
  var KEY = 'visitor-counts';
  var base = 'https://' + code + '.goatcounter.com/counter/TOTAL.json';

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(d.getDate()).padStart(2, '0');
  }
  var today = ymd(new Date());

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  if (saved.day !== today) { delete saved.today; saved.day = today; }

  function put(id, value) {
    var el = document.getElementById(id);
    if (el && value != null) el.textContent = value;
  }
  put('total-visitors', saved.total);
  put('today-visitors', saved.today);

  if (!window.fetch) return;
  function load(field, id, url) {
    fetch(url)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        put(id, d.count);
        saved[field] = d.count;
        try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
      })
      .catch(function () {
        var el = document.getElementById(id);
        if (el && saved[field] == null) {
          el.textContent = '-';
          el.title = 'Visitor count unavailable';
        }
      });
  }
  load('total', 'total-visitors', base);
  load('today', 'today-visitors', base + '?start=' + today + '&end=' + today);
})();
</script>
