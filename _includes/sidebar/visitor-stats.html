<!-- Cute Sticky Note - Visitor Stats -->
<div class="sticky-note-widget visitor-sticky">
  <div class="sticky-tape"></div>
  <div class="sticky-content">
    <div class="sticky-title">
      <span class="sticky-icon">👀</span>
      <span>Visitors</span>
    </div>
    <div class="visitor-stats-grid">
      <div class="visitor-stat">
        <span class="stat-emoji">🌅</span>
        <span class="stat-label">Today</span>
        <span class="stat-value" id="today-visitors">-</span>
      </div>
      <div class="visitor-stat">
        <span class="stat-emoji">🌍</span>
        <span class="stat-label">Total</span>
        <span class="stat-value" id="total-visitors">-</span>
      </div>
    </div>
  </div>
  <div class="sticky-corner"></div>
</div>

{%- comment -%} styles: _sass/misc/sidebar-widgets.scss {%- endcomment -%}

<script>
// Site-wide visitor counts from GoatCounter's public counter
// (_data/goatcounter.yml). These used to be kept in each visitor's own
// localStorage, so every browser showed only its own visits.
// GoatCounter caches these responses for up to 4 hours.
(function() {
  var code = {{ site.data.goatcounter.code | jsonify }};

  // the old per-browser tally is meaningless now; drop it
  try {
    localStorage.removeItem('blog_visitor_stats');
    localStorage.removeItem('blog_last_visit_date');
  } catch (e) {}

  if (!code || !window.fetch) return;
  var base = 'https://' + code + '.goatcounter.com/counter/TOTAL.json';

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(d.getDate()).padStart(2, '0');
  }

  function show(id, url) {
    var el = document.getElementById(id);
    if (!el) return;
    fetch(url)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { el.textContent = d.count; })
      .catch(function () {
        el.textContent = '-';
        el.title = 'Visitor count unavailable';
      });
  }

  var today = ymd(new Date());
  show('total-visitors', base);
  show('today-visitors', base + '?start=' + today + '&end=' + today);
})();
</script>
