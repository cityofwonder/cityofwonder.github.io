<script>
// Notion-style comments. Wide screens (>=1500px, enough left margin) show the
// notes pinned in the left page margin, open by default — click the word to
// collapse/expand. Narrow screens open a popover on click that stays until you
// click elsewhere. Bubbles are moved to be direct children of .post-content so
// the file-tree list items (position:relative) can't capture their positioning.
(function () {
  // Margin-note geometry. MIN_MARGIN is derived rather than hard-coded: with a
  // threshold below NOTE_MIN + GAP + PAGE_EDGE the note was allowed to be wider
  // than the margin it sits in and lapped over the body text.
  var NOTE_MIN  = 110;  // narrowest a note may be
  var NOTE_MAX  = 300;
  var PAGE_EDGE = 60;   // gap from the window's left edge
  var GAP       = 10;   // gap between the note and the body
  var MIN_MARGIN = NOTE_MIN + GAP + PAGE_EDGE;

  function init() {
    var content = document.querySelector('.post .post-content');
    if (!content) return;
    var words = [].slice.call(content.querySelectorAll('.notion-comment'));
    if (!words.length) return;
    var html = document.documentElement;

    var pairs = words.map(function (w) {
      var b = w.querySelector('.comment-bubble');
      if (b) {
        content.appendChild(b); // re-parent to the content box
        var label = w.textContent.trim(); // anchor text (bubble already removed)
        if (label && !b.querySelector('.comment-quote')) {
          var q = document.createElement('div');
          q.className = 'comment-quote';
          q.textContent = label; // (2) show what this note is attached to
          b.insertBefore(q, b.firstChild);
        }
      }
      return { word: w, bubble: b };
    }).filter(function (p) { return p.bubble; });

    function layoutMargin() {
      html.classList.add('nc-margin');
      html.classList.remove('nc-popover');
      var cRect = content.getBoundingClientRect();
      var noteW = Math.min(NOTE_MAX, cRect.left - GAP - PAGE_EDGE);
      var sorted = pairs.slice().sort(function (a, b) {
        return a.word.getBoundingClientRect().top - b.word.getBoundingClientRect().top;
      });
      var prevBottom = -1e9;
      sorted.forEach(function (p) {
        p.bubble.classList.remove('is-open');
        p.bubble.style.left = (PAGE_EDGE - cRect.left) + 'px'; // note's left edge near the window edge
        p.bubble.style.width = noteW + 'px';
        if (p.bubble.classList.contains('is-collapsed')) return;
        var wTop = p.word.getBoundingClientRect().top - cRect.top;
        var top = Math.max(wTop, prevBottom + 12); // push down to avoid overlap
        p.bubble.style.top = top + 'px';
        prevBottom = top + p.bubble.offsetHeight;
      });
    }

    function setupPopover() {
      html.classList.add('nc-popover');
      html.classList.remove('nc-margin');
      pairs.forEach(function (p) {
        p.bubble.classList.remove('is-open');
        p.bubble.style.top = '';
        p.bubble.style.left = '';
        p.bubble.style.width = '';
      });
    }

    function openPopover(p) {
      pairs.forEach(function (q) { q.bubble.classList.remove('is-open'); });
      var cRect = content.getBoundingClientRect();
      var w = p.word.getClientRects()[0] || p.word.getBoundingClientRect();
      p.bubble.style.left = (w.left - cRect.left) + 'px';
      p.bubble.style.top = (w.bottom - cRect.top + 8) + 'px';
      p.bubble.classList.add('is-open');
      // keep it inside the content's right edge
      var over = (p.bubble.offsetLeft + p.bubble.offsetWidth) - content.clientWidth;
      if (over > 0) p.bubble.style.left = Math.max(0, p.bubble.offsetLeft - over - 4) + 'px';
    }

    function apply() {
      // Decide by the ACTUAL left margin (room for notes), not innerWidth —
      // innerWidth flips when the scrollbar appears and made the mode flicker.
      if (content.getBoundingClientRect().left >= MIN_MARGIN) {
        layoutMargin();
      } else {
        setupPopover();
      }
    }

    pairs.forEach(function (p) {
      // (3) hover either the word or the note -> brighten both
      function on() { p.bubble.classList.add('nc-active'); p.word.classList.add('nc-word-active'); }
      function off() { p.bubble.classList.remove('nc-active'); p.word.classList.remove('nc-word-active'); }
      p.word.addEventListener('mouseenter', on);
      p.word.addEventListener('mouseleave', off);
      p.bubble.addEventListener('mouseenter', on);
      p.bubble.addEventListener('mouseleave', off);

      p.word.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('a')) return; // let links work
        if (html.classList.contains('nc-margin')) {
          p.bubble.classList.toggle('is-collapsed');
          layoutMargin();
        } else {
          if (p.bubble.classList.contains('is-open')) p.bubble.classList.remove('is-open');
          else openPopover(p);
          e.stopPropagation();
        }
      });
      p.bubble.addEventListener('click', function (e) { e.stopPropagation(); });
    });

    document.addEventListener('click', function () {
      if (html.classList.contains('nc-popover')) {
        pairs.forEach(function (q) { q.bubble.classList.remove('is-open'); });
      }
    });

    function applyInstant() {
      html.classList.remove('nc-animate'); // placement / image-settle reflow shouldn't animate
      apply();
      setTimeout(function () { html.classList.add('nc-animate'); }, 60);
    }

    var t;
    function scheduleApply() { clearTimeout(t); t = setTimeout(apply, 100); }

    window.addEventListener('resize', scheduleApply);
    window.addEventListener('load', applyInstant); // re-layout once images settle

    // Anything that changes the article's height moves every note below it: a
    // <details> opening, MathJax typesetting a formula, an image or web font
    // landing late. Previously the notes kept whatever offset they were given
    // at load and drifted away from the text they annotate.
    if (window.ResizeObserver) {
      new ResizeObserver(scheduleApply).observe(content);
    }
    // The `toggle` event does not bubble, hence the capture listener.
    content.addEventListener('toggle', scheduleApply, true);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(applyInstant);
    }
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(applyInstant);
    }

    applyInstant();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
