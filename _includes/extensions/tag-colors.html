<script>
// Give every .post-tag a highlighter colour, picked deterministically from the
// six key colours (_sass/misc/tokens.scss) by hashing the tag name → same tag,
// same colour.
(function () {
  var COLORS = ['gray', 'red', 'orange', 'yellow', 'green', 'blue'];

  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function apply() {
    var tags = document.querySelectorAll('.post-tag');
    for (var i = 0; i < tags.length; i++) {
      var t = tags[i];
      if (t.getAttribute('data-tag-colored')) continue;
      var name = t.textContent.replace(/^#/, '').trim();
      if (!name) continue;
      t.classList.add('highlight-' + COLORS[hash(name) % COLORS.length]);
      t.setAttribute('data-tag-colored', '1');
    }
  }

  // exposed so content built later (e.g. the tags page's slide/table views)
  // can colour its tags the same way, and so the tag graph can tint a node
  // with its tag's colour: window.tagColorKey('AISEC') -> 'orange'
  window.colorTags = apply;
  window.tagColorKey = function (name) { return COLORS[hash(name) % COLORS.length]; };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
})();
</script>
