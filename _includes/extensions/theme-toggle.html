<div class="theme-toggle">
  <input type="checkbox" id="theme-switch">
  <label for="theme-switch">
    <div class="toggle"></div>
    <div class="names">
      <p class="light">Light</p>
      <p class="dark">Dark</p>
    </div>
  </label>
</div>

{%- assign name = 'night_mode' -%}
{%- include functions.html func='get_value' default='auto' -%}
{%- assign night_mode = return -%}

<script>
  (function() {
    var sw = document.getElementById('theme-switch');
    var html = document.getElementsByTagName('html')[0];
    var nightModeOption = ('{{ night_mode }}' || 'auto').toLowerCase();
    var storage = nightModeOption === 'manual'
        ? localStorage
        : sessionStorage;
    var themeData = loadThemeData();

    function saveThemeData(data) {
      storage.setItem('theme', JSON.stringify(data));
    }

    function loadThemeData() {
      var data = storage.getItem('theme');
      try {
        data = JSON.parse(data ? data : '');
      } catch(e) {
        data = { nightShift: undefined, autoToggleAt: 0 };
        saveThemeData(data);
      }
      return data;
    }

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    var switches = 0;

    // The new theme on <html> with every transition held off, so the whole
    // page turns in the same frame: each part used to fade on its own clock
    // (0.1-0.3s), the header already dark while the feed was still light.
    // (misc/page-transitions.scss: html.theme-switching.)
    function applyTheme(theme) {
      html.classList.add('theme-switching');
      html.dataset.theme = theme;
      void html.offsetWidth;                 // restyle now, while they're off
      html.classList.remove('theme-switching');
    }

    // smooth: the old page cross-fades into the new one as one picture (a
    // view transition), where the browser can; otherwise it just switches
    function setTheme(theme, smooth) {
      if (html.dataset.theme === theme) return;
      if (!smooth || !document.startViewTransition || (reduceMotion && reduceMotion.matches)) {
        applyTheme(theme);
        return;
      }
      var mine = ++switches;
      html.classList.add('theme-vt');
      var vt = document.startViewTransition(function () { applyTheme(theme); });
      var done = function () { if (mine === switches) html.classList.remove('theme-vt'); };
      vt.finished.then(done, done);
    }

    function handleThemeToggle(nightShift, smooth) {
      themeData.nightShift = nightShift;
      saveThemeData(themeData);
      setTheme(nightShift ? 'dark' : 'light', smooth);
      // set the switch right away: setting it later made it slide across
      // on every page load (the theme itself is already set in <head>)
      sw.checked = nightShift ? true : false;
      setTimeout(function() {
        document.dispatchEvent(new Event('theme-changed'));
      }, 50);
    }

    function autoThemeToggle() {
      // Next time point of theme toggle
      var now = new Date();
      var toggleAt = new Date();
      var hours = now.getHours();
      var nightShift = hours >= 19 || hours <=7;

      if (nightShift) {
        if (hours > 7) {
          toggleAt.setDate(toggleAt.getDate() + 1);
        }
        toggleAt.setHours(7);
      } else {
        toggleAt.setHours(19);
      }

      toggleAt.setMinutes(0);
      toggleAt.setSeconds(0);
      toggleAt.setMilliseconds(0)

      var delay = toggleAt.getTime() - now.getTime();

      // auto toggle theme mode
      setTimeout(function() {
        handleThemeToggle(!nightShift, true);
      }, delay);

      return {
        nightShift: nightShift,
        toggleAt: toggleAt.getTime()
      };
    }

    // Listen the theme toggle event
    sw.addEventListener('change', function(event) {
      handleThemeToggle(event.target.checked, true);
    });

    if (nightModeOption == 'auto') {
      var data = autoThemeToggle();

      // Toggle theme by local setting
      if (data.toggleAt > themeData.autoToggleAt) {
        themeData.autoToggleAt = data.toggleAt;
        handleThemeToggle(data.nightShift);
      } else {
        handleThemeToggle(themeData.nightShift);
      }
    } else if (nightModeOption == 'manual') {
      handleThemeToggle(themeData.nightShift);
    } else {
      var nightShift = themeData.nightShift;
      if (nightShift === undefined) {
        nightShift = nightModeOption === 'on';
      }
      handleThemeToggle(nightShift);
    }
  })();
</script>
