<script>
// Hide the sidebar (ToC / widgets) only when the page's main column would be
// left too narrow beside it -- every page alike. It stays while the main
// column keeps MIN_MAIN px or more. On a post page, when the ToC disappears
// its links are folded into a "바로가기" card at the top of the body (styles:
// misc/article-menu.scss). (A feed squeezed beside it turns into one column
// on its own: misc/feed.scss.)
(function () {
  var MIN_MAIN = 529; // the main column's narrowest width with the sidebar beside it

  function init() {
    var sidebar = document.querySelector('.framework .sidebar');
    var main = document.querySelector('.framework .main');
    if (!sidebar || !main) return;
    var content = document.querySelector('.post .post-content');
    var menu = document.querySelector('.post-menu'); // TOC (post pages only)
    var inlineToc = null;

    function buildInlineToc() {
      if (inlineToc || !content || !menu) return;
      var srcUl = menu.querySelector('.post-menu-content ul');
      if (!srcUl) return; // no headings -> no TOC

      var box = document.createElement('nav');
      box.className = 'toc-card';
      var body = document.createElement('div');
      body.className = 'toc-tree';
      var ul = srcUl.cloneNode(true);
      // the sidebar ToC folds other sections away on long posts; show them all
      [].forEach.call(ul.querySelectorAll('li'), function (li) { li.style.display = ''; });
      body.appendChild(ul);
      box.appendChild(body);
      content.insertBefore(box, content.firstChild);
      inlineToc = box;
    }
    function removeInlineToc() {
      if (inlineToc && inlineToc.parentNode) inlineToc.parentNode.removeChild(inlineToc);
      inlineToc = null;
    }

    // measured with the sidebar in place (shown, then hidden again in the
    // same frame if the main column came out too narrow: nothing flickers)
    function apply() {
      sidebar.classList.remove('is-hidden');
      if (main.getBoundingClientRect().width < MIN_MAIN) {
        sidebar.classList.add('is-hidden');
        buildInlineToc();
      } else {
        removeInlineToc();
      }
    }

    var t;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(apply, 150); });
    apply();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
