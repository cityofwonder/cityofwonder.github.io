# Welcome to Jekyll!
#
# About Theme
#
# Yet another theme for elegant writers with modern flat style and beautiful
# night/dark mode.
#
# Website: https://github.com/jeffreytse/jekyll-theme-yat
#
# You can do anything you want, including projects for your clients, as long
# as you mention an attribution back (credit links in footer or project).
# See the LICENCE file.
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
#
# For technical reasons, this file is *NOT* reloaded automatically when you
# use 'bundle exec jekyll serve'. If you change this file, please restart
# the server process.
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: CoW's blog
email: jshrbejxugwhqkaoa8@korea.ac.kr
author: cityofwonder
github_username: cityofwonder

# Copyright setting
# You can use any html code, currently below placeholders are available:
# * current year: {currentYear}
# * author: {author} (Value is the same as site.author)
# * copyright: (c) - ©
# * copyleft: (cleft)
# * sound recording copyright: (p) - ℗
#
# For example:
#   "Copyright (c) 2017-{currentYear} <a href="https://example.com">{author}</a>"
#   "Copyright © 2017-2021 Foobar"
#
copyright: "(cleft) 2022-{currentYear} {author}"

description: >-
  2023.03~ Korea Univ. in Seoul, South Korea
  2022.03~2023.03 BoB 11th

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://cityofwonder.github.io"
# favicon: set in _includes/head.html (assets/images/favicon/duckcat-*.png)

# Yat date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
yat:
  date_format: "%b %d, %Y"

# If you want more debug log, you can set true
# debug: false

# If you don't want transparent header, you can set false
# header_transparent: true

# If you want to change the content width, you can set to another value
# Default is 920px. 1200px keeps enough left margin for the margin comments.
content_width: "1200px"

# Google analytics - GA4
# google_analytics: [Measurement ID]
# enableDNT: "false"

# If you want to generate website sitemap, you can set true
# sitemap: false

# If you want to change site language, you can set lang option
lang: "ko"  # default lang is en

# Colours: _sass/misc/tokens.scss

# You can custom selection style
# selection:
#   color: "#ff00ff"
#   background_color: "yellow"

# Night/Dark mode
# Default mode is "auto", "auto" is for auto nightshift
# (19:00 - 07:00), "manual" is for manual toggle, and
# "on/off" is for default on/off.
#
# Whatever the user's choice is, it will supersede the
# default setting of the site and be kept during the
# visit (session). Only the dark mode setting is"manual",
# it will be always kept on every visit (i.e. no matter
# the browser is closed or not)
#
# night_mode: "auto"

# Code badge setting
# You can enable or disable the code badge and so on
# code_badge:
#   enabled: "true"
#   color: "#fff"
#   background_color: "#ff4e00"
#   text_transform: "uppercase"  # ("uppercase", "lowercase", "capitalize")

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  - index.html
  - categories.html
  - tags.html
  - archives.html
  - about.html

# Page default value
# defaults:
#   home:
#     heading: "Your awesome heading"
#     subheading: "Your awesome subheading"
#     banner: "Your image url"

# Banner default settings
# These banner settings are for global banner default, but you can also
# config it by the front matter for one specific post
banner:
  video: null             # Video banner source
  loop: true              # Video loop
  volume: 0               # Video volume (100% is 1.0)
  start_at: 0             # Video start time
  image: null             # Image banner source
  opacity: 1.0            # Banner opacity (100% is 1.0)
  background: "rgba(0, 0, 0, 0.8)"  # Banner background (Could be a image)
  # (no height: a banner is as tall as its title, subtitle and tags plus a margin)
  heading_style: 'font-family: "Pretendard", sans-serif; font-weight: 800'     # Pretendard ExtraBold for heading
  subheading_style: 'font-family: "Pretendard", sans-serif; font-weight: 800'  # Pretendard ExtraBold for subheading

# Excerpt settings (feed cards)
# excerpt:
#   default_image: /assets/images/default-image.jpeg  # image for posts without a banner
#   text_size: 350          # Words default size

# Permalink setting (shorter URLs without categories)
permalink: /:year/:month/:day/:title/

# Pagination setting
# Page 1 shows the 2 pinned posts as side-by-side cards (outside this count)
# and spends the rest of its slice on the 2-column grid: 8 - 2 pinned = 6
# compact cards, i.e. 3 full rows. Re-check this if rows go ragged after
# adding posts -- the grid needs an EVEN number of compact cards per page.
paginate: 8

# Photo previewer settings (PhotoSwipe 5)
# the options please refer to: https://photoswipe.com/options/
# photo_previewer:
#  gallery: "section.main"
#  children: "a.photo-swipe"
#  bgOpacity: 0.8
#  padding:
#    top: 20
#    bottom: 40
#    left: 100
#    right: 100


# Local serve settings (WSL on /mnt/c can't use inotify, so force polling)
# These only affect `jekyll serve`; GitHub Pages builds ignore them.
livereload: true
force_polling: true

# Build settings
# highlighter: none
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

  - jekyll-spaceship

# jekyll-spaceship's mathjax processor hardcodes a script tag for polyfill.io,
# which was taken over in 2024 and served malware to the sites embedding it;
# the domain now answers with an HTTP auth prompt. Override the src list to
# load MathJax 3 alone -- it needs no ES6 polyfill in any current browser.
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
